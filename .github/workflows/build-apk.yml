name: Build APK

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Show the build environment
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Check the string resources
        run: python3 tools/check_strings.py

      # Whole-project mistakes no single file looks wrong for: two files in one
      # package declaring the same thing, and R.string keys with nothing behind
      # them. Seconds here instead of four minutes into a Gradle build.
      - name: Check the Kotlin sources
        run: python3 tools/check_kotlin.py

      - name: Check the Gradle wrapper
        timeout-minutes: 10
        run: ./gradlew --no-daemon --console=plain --version

      - name: Resolve the build configuration
        timeout-minutes: 15
        run: ./gradlew --no-daemon --console=plain --stacktrace :app:tasks --all

      - name: Build the APK
        timeout-minutes: 30
        run: ./gradlew --no-daemon --console=plain --stacktrace :app:assembleDebug

      # The release variant is minified and resource shrunk. It is still built
      # here so the config and the keep rules cannot rot, but it is NOT
      # published: the 2.0 release APK crashed on launch on a real phone, and a
      # green build says nothing about that — R8 breaks things at run time, not
      # at compile time. Nothing goes out for install until it has been run.
      - name: Build the release APK (not published)
        timeout-minutes: 30
        run: ./gradlew --no-daemon --console=plain --stacktrace :app:assembleRelease

      - name: Collect the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/BookQuest.apk
          # Deliberately not copied into out/: see the build step above.
          ls -lh out
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Built BookQuest $VERSION"
          keytool -list -v -keystore keystore/debug.keystore -storepass android \
            -alias androiddebugkey | grep "SHA1:" || true

      - name: Upload the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BookQuest-apk
          path: out/BookQuest.apk
          if-no-files-found: error

      - name: Publish the APK to the rolling release
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest out/BookQuest.apk \
            --title "BookQuest APK (latest build)" \
            --notes "BookQuest ${{ env.APP_VERSION }}, built from ${{ github.sha }} on branch ${{ github.ref_name }}. Install BookQuest.apk on an Android phone (Android 7.0 or newer). This is the only APK published: the minified release build is still compiled by CI to keep its configuration honest, but it is not handed out until it has been run on a device." \
            --prerelease
