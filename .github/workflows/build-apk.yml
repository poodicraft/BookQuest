name: Build APK

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Show the build environment
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Check the string resources
        run: python3 tools/check_strings.py

      - name: Check the Gradle wrapper
        timeout-minutes: 10
        run: ./gradlew --no-daemon --console=plain --version

      - name: Resolve the build configuration
        timeout-minutes: 15
        run: ./gradlew --no-daemon --console=plain --stacktrace :app:tasks --all

      - name: Build the APK
        timeout-minutes: 30
        run: ./gradlew --no-daemon --console=plain --stacktrace :app:assembleDebug

      # The release variant is minified and resource shrunk. Building it here is
      # what proves the keep rules in proguard-rules.pro are right; a release
      # config that is never built is a config that is quietly broken.
      - name: Build the release APK
        timeout-minutes: 30
        run: ./gradlew --no-daemon --console=plain --stacktrace :app:assembleRelease

      - name: Collect the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/BookQuest.apk
          cp app/build/outputs/apk/release/app-release.apk out/BookQuest-release.apk
          ls -lh out
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Built BookQuest $VERSION"
          keytool -list -v -keystore keystore/debug.keystore -storepass android \
            -alias androiddebugkey | grep "SHA1:" || true

      - name: Upload the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BookQuest-apk
          path: |
            out/BookQuest.apk
            out/BookQuest-release.apk
          if-no-files-found: error

      - name: Publish the APK to the rolling release
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest out/BookQuest.apk out/BookQuest-release.apk \
            --title "BookQuest APK (latest build)" \
            --notes "BookQuest ${{ env.APP_VERSION }}, built from ${{ github.sha }} on branch ${{ github.ref_name }}. Install BookQuest.apk on an Android phone (Android 7.0 or newer). BookQuest-release.apk is the same version minified and shrunk; both are signed with the same key, so either installs over the other." \
            --prerelease
